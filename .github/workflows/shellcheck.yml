name: Shellcheck

on:
  push:
    branches: [main]
    paths:
      - "*.sh"
  pull_request:
    branches: [main]
    paths:
      - "*.sh"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: style
